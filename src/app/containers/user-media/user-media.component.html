<div class="head-container">
  <div class="header-content">
    <div class="search-auth-row">
      <div class="search-wrapper">
        <app-media-filters
          (filterChange)="onFiltersChanged($event)">
        </app-media-filters>
      </div>
      
      <div class="auth-wrapper">
        <auth-form></auth-form>
      </div>
    </div>
  </div>

  <div class="logo-theme-container">
    <a routerLink="/">
      <svg class="logo-themeable" width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
        <rect class="logo-bg" width="200" height="60" rx="4"/>
        <text class="logo-text" x="50" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="300">My Movie</text>
        <rect class="logo-icon-bg" x="10" y="15" width="30" height="30" rx="4"/>
        <polygon class="logo-icon" points="20,22 20,38 32,30"/>
      </svg>
    </a>
    
    @if (isBrowser) {        
      <app-theme-switcher></app-theme-switcher>
    }
  </div>
</div>

@if (userId) {
  <app-user-media-categories 
    [filters]="currentFilters" 
    [userId]="userId">
  </app-user-media-categories>
}
