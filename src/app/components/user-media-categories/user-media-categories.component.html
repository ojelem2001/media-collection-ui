<div class="category-tabs">
    <button 
      class="category-tab" 
      [class.active]="currentView === mediaType.Movie"
      (click)="showMovies()">
      <i class="tab-icon movie-icon"></i>
      <span>Фильмы</span>
      <span class="counter">{{moviesCount$$.getValue()}}</span>
    </button>
    
    <button 
      class="category-tab" 
      [class.active]="currentView === mediaType.Series"
      (click)="showSeries()">
      <i class="tab-icon series-icon"></i>
      <span>Сериалы</span>
      <span class="counter">{{seriesCount$$.getValue()}}</span>
    </button>
  </div>
  
  @if (currentView === mediaType.Movie) {
    @if (movies$ | async; as movies) {
       <app-media-list
        [filters]="filters" 
        [medias]="movies">
      </app-media-list>
    } @else {
      <div class="loader-container">Загрузка...</div>
    }
  }

  @if (currentView === mediaType.Series) {
     @if (series$ | async; as series) {
       <app-media-list
        [filters]="filters" 
        [medias]="series">
      </app-media-list>
    } @else {
      <div class="loader-container">Загрузка...</div>
    }
  }
