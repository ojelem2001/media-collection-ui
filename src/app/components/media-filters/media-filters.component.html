<div class="filters-main">
    <!-- Поисковая строка (теперь в отдельном блоке) -->
    <div class="search-wrapper">
      <div class="filter-group search-group">
         <label for="search">
          <i class="search-icon">🔍</i>
        </label>
        <input
          id="search"
          type="text"
          [(ngModel)]="searchQuery"
          (change)="applyFilters()"
          placeholder="Поиск.."
        >
      </div>
    </div>

    <!-- Основные фильтры -->
    <div class="filters-row">
      <div class="filter-group">
        <label for="genre">Жанр:</label>
        <select id="genre" [(ngModel)]="selectedGenre" (change)="applyFilters()">
          <option value="">Все жанры</option>
          @for (genre of availableGenres; track genre;) {
            <option  [value]="genre">
              {{ genre }}
            </option>
          }
        </select>
      </div>

      <div class="filter-group">
        <label for="decade">Года:</label>
        <select id="decade" [(ngModel)]="selectedDecade" (change)="applyFilters()">
          @for (decade of decadeFilters; track decade;) {
            <option [value]="decade">
              {{ decade }}
            </option>
          }
        </select>
      </div>

      <button class="reset-btn" (click)="resetFilters()">
        Сбросить фильтры
      </button>
    </div>
    
  </div>
